<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BanglaSnap OCR</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand-lockup">
          <img id="brand-logo" class="brand-logo" src="../assets/logo.svg" alt="">
          <div>
            <h1>BanglaSnap OCR</h1>
            <p id="brand-subtitle">Bangla &amp; English OCR for Chrome</p>
          </div>
        </div>
        <label class="power-control" title="Enable or pause BanglaSnap OCR">
          <input id="extension-enabled" type="checkbox" checked>
          <span class="power-switch" aria-hidden="true"><span></span></span>
          <span class="sr-only">Enable BanglaSnap OCR</span>
        </label>
      </header>

      <section class="card capture-card" aria-labelledby="capture-heading">
        <span class="primary-label">PRIMARY</span>
        <h2 id="capture-heading">Select text from this page</h2>
        <p>Drag a box around any visible Bangla or English text.</p>
        <button id="capture-button" class="primary-button capture-button" type="button">Select Area on Page</button>
      </section>

      <section class="card language-card" aria-labelledby="language-label">
        <label id="language-label" for="language-select">Recognition language</label>
        <div class="select-control">
          <select id="language-select" name="language">
            <option value="ben+eng">বাংলা + English</option>
            <option value="ben">বাংলা</option>
            <option value="eng">English</option>
          </select>
        </div>
      </section>

      <div id="error-message" class="message error-message" role="alert" hidden></div>

      <button id="open-upload-button" class="card upload-launch" type="button">
        <span class="upload-launch-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 15V4"/>
            <path d="m7.75 8.25 4.25-4.25 4.25 4.25"/>
            <path d="M5 13.25v4.5c0 1.24 1.01 2.25 2.25 2.25h9.5c1.24 0 2.25-1.01 2.25-2.25v-4.5"/>
          </svg>
        </span>
        <span><strong>OCR an Image</strong><small>Choose a file from your device</small></span>
      </button>

      <dialog id="image-upload-dialog" class="image-dialog" aria-labelledby="image-dialog-heading">
        <div class="dialog-shell">
          <header class="dialog-header">
            <div>
              <h2 id="image-dialog-heading">OCR an Image</h2>
              <p>Choose an image and extract its text.</p>
            </div>
            <button id="close-upload-button" class="dialog-close-button" type="button" aria-label="Close image OCR" title="Close">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
            </button>
          </header>
          <div class="dialog-body">
            <div class="upload-content">
          <div class="section-heading">
            <h2 id="image-heading">Choose an image</h2>
            <button id="clear-button" class="text-button" type="button" hidden>Clear</button>
          </div>
          <label class="file-picker" for="image-input">
            <span class="file-picker-title">Choose image</span>
            <span class="file-picker-hint">PNG, JPEG, WebP, GIF, or BMP</span>
          </label>
          <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
          <div id="image-summary" class="image-summary" hidden>
            <img id="image-preview" alt="Selected image preview">
            <div class="image-details">
              <strong id="image-name"></strong>
              <span id="image-size"></span>
              <button id="change-button" class="secondary-button" type="button">Choose another</button>
            </div>
          </div>
          <button id="run-button" class="primary-button upload-run-button" type="button" disabled>Run OCR on Image</button>
            </div>
            <div id="upload-error-message" class="message error-message" role="alert" hidden></div>

            <section id="progress-section" class="progress-section" aria-live="polite" hidden>
              <div class="progress-copy">
                <span id="progress-label">Preparing OCR…</span>
                <span id="progress-percent">0%</span>
              </div>
              <progress id="progress-bar" max="100" value="0">0%</progress>
            </section>

            <section id="result-section" class="result-section" aria-labelledby="result-heading" hidden>
              <div class="section-heading">
                <h2 id="result-heading">Recognized text</h2>
                <span id="confidence-label" class="confidence"></span>
              </div>
              <textarea id="result-text" lang="bn" spellcheck="false" aria-label="Recognized text"></textarea>
              <div class="result-actions">
                <button id="copy-button" class="primary-button" type="button">Copy Text</button>
                <span id="copy-status" class="copy-status" role="status"></span>
              </div>
            </section>
          </div>
        </div>
      </dialog>

      <footer class="copyright">© 2026 <a href="https://shakilsheikh.com/" target="_blank" rel="noopener noreferrer">Sheikh Shakil</a>. All rights reserved.</footer>
    </main>

    <script src="../vendor/tesseract/tesseract.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
