<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BanglaSnap OCR Result</title>
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <main class="panel-app">
      <header id="panel-header" title="Drag to move">
        <div class="brand-lockup">
          <img class="brand-logo" src="../assets/logo.svg" alt="">
          <div>
            <h1>BanglaSnap OCR</h1>
            <p id="language-label">Reading selected area…</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="close-button" type="button" aria-label="Close BanglaSnap OCR" title="Close">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
          </button>
        </div>
      </header>

      <section class="preview-card" aria-labelledby="preview-heading">
        <div class="section-heading">
          <h2 id="preview-heading">Selected area</h2>
        </div>
        <div class="preview-viewport">
          <img id="capture-preview" alt="Selected screen area">
        </div>
      </section>

      <section id="progress-section" class="progress-section" aria-live="polite">
        <div>
          <strong id="progress-label">Preparing selected area…</strong>
          <span id="progress-percent">0%</span>
        </div>
        <progress id="progress-bar" max="100" value="0">0%</progress>
      </section>

      <div id="error-message" class="error-message" role="alert" hidden></div>

      <section id="text-section" class="text-section" hidden>
        <div class="section-heading">
          <h2>Recognized text</h2>
          <span id="confidence-label"></span>
        </div>
        <textarea id="result-text" lang="bn" spellcheck="false" aria-label="Recognized text"></textarea>
        <div id="filter-summary" class="filter-summary" hidden>
          <span id="filter-message"></span>
          <button id="toggle-raw-button" type="button">Show all detections</button>
        </div>
      </section>

      <div class="actions">
        <div class="copy-actions">
          <button id="copy-paragraph-button" class="primary-button copy-button" type="button" data-default-label="Copy as Paragraph" disabled>
            <svg class="default-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="6.5" y="6.5" width="10" height="10" rx="2"/><path d="M13.5 6.5V5.25A1.75 1.75 0 0 0 11.75 3.5h-6.5A1.75 1.75 0 0 0 3.5 5.25v6.5A1.75 1.75 0 0 0 5.25 13.5H6.5"/></svg>
            <svg class="success-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m4.5 10.5 3.5 3.5 7.5-8"/></svg>
            <span class="button-label">Copy as Paragraph</span>
          </button>
          <button id="copy-lines-button" class="secondary-button copy-button" type="button" data-default-label="Copy with Line Breaks" disabled>
            <svg class="default-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="6.5" y="6.5" width="10" height="10" rx="2"/><path d="M13.5 6.5V5.25A1.75 1.75 0 0 0 11.75 3.5h-6.5A1.75 1.75 0 0 0 3.5 5.25v6.5A1.75 1.75 0 0 0 5.25 13.5H6.5M9.5 10h4M9.5 13h4"/></svg>
            <svg class="success-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m4.5 10.5 3.5 3.5 7.5-8"/></svg>
            <span class="button-label">Copy with Line Breaks</span>
          </button>
        </div>
        <span id="copy-status" class="sr-only" role="status" aria-live="polite"></span>
        <div class="secondary-actions">
          <button id="scan-another-button" class="secondary-button scan-button" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H5a2 2 0 0 0-2 2v2M13 3h2a2 2 0 0 1 2 2v2M17 13v2a2 2 0 0 1-2 2h-2M7 17H5a2 2 0 0 1-2-2v-2M10 7v6M7 10h6"/></svg>
            <span>Capture Another Area</span>
          </button>
        </div>
      </div>

      <footer>OCR may make mistakes. Review the result before using it.</footer>
    </main>

    <script src="../vendor/tesseract/tesseract.min.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
